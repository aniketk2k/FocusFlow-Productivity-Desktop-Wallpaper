<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exams Countdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="countdown-card">

            <div class="timer-grid" id="timer-grid">
                <!-- Dynamically populated by JS -->
            </div>

        </div>
    </div>

    <div class="controls-container">
        <select id="format-select" class="control-btn"
            style="background: rgba(15, 15, 20, 0.7); backdrop-filter: blur(20px); cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.2); color: white; border-radius: 2rem; padding: 0.8rem 1.5rem; text-align: center; font-family: 'Inter', sans-serif; text-transform: uppercase; font-size: 0.9rem; appearance: none; -webkit-appearance: none;">
            <option value="d:h:m:s">Days : Hrs : Min : Sec</option>
            <option value="h:m:s">Hrs : Min : Sec</option>
        </select>

        <input type="text" id="date-picker-input"
            style="width: 0; height: 0; opacity: 0; position: absolute; pointer-events: none;">
        <button id="date-picker-btn" class="control-btn">Set Target Time</button>

        <input type="file" id="bg-upload" accept="image/*" hidden>
        <label for="bg-upload" class="control-btn">Change Wallpaper</label>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="script.js"></script>
</body>

</html>
