<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exams Countdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@400;700;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0)), url('image_1.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            overflow: hidden;
            color: white;
            font-size: 1.5vh;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            /* Overlay for contrast */
        }

        .countdown-card {
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border-radius: 0;
            padding: 0;
            text-align: center;
            box-shadow: none;
            border: none;
            max-width: 1600px;
            width: 90vw;
            transition: all 0.3s ease;
        }

        /* Title removed */

        .timer-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr auto 1fr;
            gap: 1rem;
            width: 100%;
            align-items: center;
        }

        .separator {
            font-family: 'Orbitron', sans-serif;
            font-size: 8rem;
            font-weight: 900;
            color: white;
            padding-bottom: 2rem;
            line-height: 1;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .timer-box {
            background: transparent;
            padding: 2rem;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
            border: none;
        }

        .timer-box:hover {
            transform: scale(1.05);
            background: transparent;
            box-shadow: none;
            border-color: transparent;
        }

        .timer-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 10rem;
            font-weight: 900;
            margin-bottom: 0;
            line-height: 1;
            letter-spacing: 0.5rem;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .timer-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            text-transform: uppercase;
            opacity: 0.5;
            letter-spacing: 0.3rem;
            font-weight: 500;
            margin-top: 1rem;
        }

        /* Responsive adjustments */
        @media (max-width: 1200px) {
            .title {
                font-size: 5rem;
            }

            .timer-number {
                font-size: 7rem;
            }
        }

        @media (max-width: 768px) {
            .timer-grid {
                gap: 1rem;
            }

            .timer-number {
                font-size: 4rem;
            }

            .title {
                font-size: 3rem;
                margin-bottom: 2rem;
            }

            .timer-label {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="countdown-card">

            <div class="timer-grid">
                <div class="timer-box">
                    <span class="timer-number" id="hours">00</span>
                    <span class="timer-label">Hours</span>
                </div>
                <div class="separator">:</div>
                <div class="timer-box">
                    <span class="timer-number" id="minutes">00</span>
                    <span class="timer-label">Minutes</span>
                </div>
                <div class="separator">:</div>
                <div class="timer-box">
                    <span class="timer-number" id="seconds">00</span>
                    <span class="timer-label">Seconds</span>
                </div>
            </div>

        </div>
    </div>

    <div class="bg-picker-container">
        <input type="file" id="bg-upload" accept="image/*" hidden>
        <label for="bg-upload" class="bg-picker-btn">Change Wallpaper</label>
    </div>

    <script>
        // Set the date we're counting down to
        const countDownDate = new Date("Feb 27, 2026 14:00:00").getTime();

        function updateTimer() {
            // Get today's date and time
            const now = new Date().getTime();

            // Find the distance between now and the count down date
            const distance = countDownDate - now;

            // Time calculations for hours (aggregated), minutes and seconds
            const hours = Math.floor(distance / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Display the result in the elements
            const formatTime = (time) => time < 10 ? `0${time}` : time;

            document.getElementById("hours").innerText = formatTime(hours);
            document.getElementById("minutes").innerText = formatTime(minutes);
            document.getElementById("seconds").innerText = formatTime(seconds);

            // If the count down is finished, write some text
            if (distance < 0) {
                clearInterval(x);
                document.querySelector(".title").innerHTML = "EXAMS STARTED";
                document.querySelector(".timer-grid").style.display = "none";
            }
        }

        // Update the count down every 1 second
        updateTimer(); // Run immediately to avoid 1s delay
        const x = setInterval(updateTimer, 1000);

        // Background Picker Logic
        const bgUpload = document.getElementById('bg-upload');
        const body = document.body;

        // Load saved background
        const savedBg = localStorage.getItem('custom-bg');
        if (savedBg) {
            body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), url('${savedBg}')`;
        }

        bgUpload.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const bgUrl = e.target.result;
                    body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), url('${bgUrl}')`;
                    try {
                        localStorage.setItem('custom-bg', bgUrl);
                    } catch (err) {
                        console.warn('Storage quota exceeded or disabled', err);
                    }
                }
                reader.readAsDataURL(file);
            }
        });
    </script>

    <style>
        .bg-picker-container {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            z-index: 100;
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }

        .bg-picker-container:hover {
            opacity: 1;
        }

        .bg-picker-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .bg-picker-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }
    </style>
</body>

</html>
